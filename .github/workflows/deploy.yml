name: Deploy to Cloudflare

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://opencut:opencut@localhost:5432/opencut' }}
      BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET || 'supersecret' }}
      NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || 'https://opencut.example.com' }}
      UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL || 'https://your-upstash-redis-url' }}
      UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN || 'your-upstash-redis-token' }}
      NEXT_PUBLIC_MARBLE_API_URL: ${{ vars.NEXT_PUBLIC_MARBLE_API_URL || 'https://placeholder.example.com' }}
      MARBLE_WORKSPACE_KEY: ${{ secrets.MARBLE_WORKSPACE_KEY || 'placeholder' }}
      FREESOUND_CLIENT_ID: ${{ secrets.FREESOUND_CLIENT_ID || 'placeholder' }}
      FREESOUND_API_KEY: ${{ secrets.FREESOUND_API_KEY || 'placeholder' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install

      - name: Build WASM
        run: bun run build:wasm

      - name: Build Web
        run: bun run build:web

      - name: Deploy Web to Cloudflare
        run: bun run deploy:web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
